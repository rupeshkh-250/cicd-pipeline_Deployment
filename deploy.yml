name: CI-CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Test App
      run: |
        python -c "import app; print('App Test Passed')"

    - name: Build Docker Image
      run: |
        docker build -t my-app:latest .

    - name: Deployment Success
      run: echo "Deployment Successful - Ready for Production"